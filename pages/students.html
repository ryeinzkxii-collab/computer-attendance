<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Computer | Attendance</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/pages/attendance.css" />
  </head>

  <body class="w-screen h-screen d-flex flex-row bg-light">
    <!-- Sidebar Navigation -->
    <aside class="pl-5 w-384">
      <div class="pr-5 h-100 d-flex flex-column border-light-gray border-r">
        <!-- Logo -->
        <div class="pt-10 d-flex items-center gap-3">
          <div class="w-64 h-auto">
            <img class="w-100 h-100" src="../assets/images/logo/britech-logo.png" alt="BRITECH Logo" />
          </div>

          <div>
            <p class="text-sm font-extrabold text-dark">COMPUTER</p>
            <p class="text-xs text-gray">ATTENDANCE SYSTEM</p>
          </div>
        </div>

        <!-- Navigation Menu -->
        <nav class="mt-8 d-flex flex-1 flex-column gap-2">
          <!-- Dashboard -->
          <a href="./dashboard.html" class="btn-tertiary btn-nav">
            <span class="fa-solid fa-shapes"></span>
            Dashboard
          </a>

          <!-- Attendance -->
          <a href="./attendance.html" class="btn-tertiary btn-tertiary__is-active btn-nav">
            <span class="fa-solid fa-clipboard-user"></span>
            Attendance
          </a>

          <!-- Students -->
          <a href="./students.html" class="btn-tertiary btn-nav">
            <span class="fa-solid fa-users"></span>
            Students
          </a>

          <!-- Computer Submenu -->
          <div class="d-flex flex-column">
            <button id="computerToggle" class="btn-tertiary btn-nav__sub-item">
              <div>
                <span class="mr-1 fa-solid fa-computer"></span>
                Computer
              </div>

              <i id="computerChevron" class="fa-solid fa-chevron-down"></i>
            </button>

            <div id="computerMenu" class="d-none flex-column">
              <a class="ml-12 btn-tertiary btn-nav" href="./computer/lists.html">Lists</a>
              <a class="ml-12 btn-tertiary btn-nav" href="./computer/status.html">Status</a>
            </div>
          </div>

          <!-- School Submenu -->
          <div class="d-flex flex-column">
            <button id="schoolToggle" class="btn-tertiary btn-nav__sub-item">
              <div>
                <span class="mr-1 fa-solid fa-school"></span>
                School
              </div>

              <i id="schoolChevron" class="fa-solid fa-chevron-down"></i>
            </button>

            <div id="schoolMenu" class="d-none flex-column">
              <a class="ml-12 btn-tertiary btn-nav" href="./school/school-year.html">School Year</a>
              <a class="ml-12 btn-tertiary btn-nav" href="./school/strand.html">Grade & Strand</a>
              <a class="ml-12 btn-tertiary btn-nav" href="./school/section.html">Sections</a>
            </div>
          </div>

          <!-- Accounts -->
          <a href="./accounts.html" class="btn-tertiary btn-nav">
            <span class="mr-1 fa-solid fa-user-tie"></span>
            Accounts
          </a>

          <!-- Reports -->
          <a href="./reports.html" class="btn-tertiary btn-nav">
            <span class="fa-solid fa-chart-column"></span>
            Reports
          </a>
        </nav>

        <!-- Sign-out -->
        <div class="pb-5">
          <a href="../index.html" class="w-100 btn-tertiary btn-nav">
            <span class="fa-solid fa-right-to-bracket"></span>
            Sign-out
          </a>
        </div>
      </div>
    </aside>

    <!-- Main Workspace Area -->
    <div class="w-100 h-screen bg-warning">
      <!-- Welcome Header -->
      <header class="p-5 d-flex flex-row items-center header__h-15">
        <div
          class="px-5 w-100 h-100 d-flex flex-row justify-between items-center bg-white border border-light-gray rounded-md shadow-md"
        >
          <div>
            <p class="text-gray text-md">Welcome!</p>
            <h1 class="text-secondary text-xl">Juan Dela Cruz</h1>
          </div>

          <h1 class="text-primary text-xl">Attendance</h1>
        </div>
      </header>

      <!-- Main Content Container (Placed Directly Below Header) -->
      <main class="p-5 d-flex flex-column gap-5 main-container__h-85">
        <section class="p-5 bg-white border border-light-gray rounded-md shadow-md">
          <h2 class="text-lg font-bold text-dark mb-4">Student Information</h2>

          <form action="#" method="post" class="d-flex flex-column gap-3">
            <fieldset class="border border-light-gray p-4 rounded-md">
              <legend class="px-2 text-sm font-semibold text-primary">Lab Station Details</legend>

              <div class="d-flex flex-column gap-1 mb-3">
                <label for="pcnumber" class="text-sm font-semibold text-dark">PC Number:</label>
                <input
                  type="text"
                  id="pcnumber"
                  name="pcnumber"
                  placeholder="Enter PC number (e.g., PC-01)"
                  class="p-2 border border-light-gray rounded-md"
                  required
                />
              </div>

              <div class="d-flex flex-column gap-1">
                <label for="status" class="text-sm font-semibold text-dark">Status:</label>
                <input
                  type="text"
                  id="status"
                  name="status"
                  placeholder="Enter status (e.g., Active / In-Use)"
                  class="p-2 border border-light-gray rounded-md"
                  required
                />
              </div>
            </fieldset>

            <fieldset class="border border-light-gray p-4 rounded-md">
              <legend class="px-2 text-sm font-semibold text-primary">Attendance Registration</legend>

              <div class="d-flex flex-column gap-1 mb-3">
                <label for="student" class="text-sm font-semibold text-dark">Student Name:</label>
                <input
                  type="text"
                  id="student"
                  name="student"
                  placeholder="Enter your full name"
                  class="p-2 border border-light-gray rounded-md"
                  required
                />
              </div>

              <div class="d-flex flex-column gap-1 mb-3">
                <label for="attendance_date" class="text-sm font-semibold text-dark">Attendance Date:</label>
                <input
                  type="date"
                  id="attendance_date"
                  name="attendance_date"
                  class="p-2 border border-light-gray rounded-md"
                  required
                />
              </div>

              <div class="d-flex flex-row gap-3 mb-3">
                <div class="d-flex flex-column gap-1 flex-1">
                  <label for="time_in" class="text-sm font-semibold text-dark">Time In:</label>
                  <input
                    type="time"
                    id="time_in"
                    name="time_in"
                    class="p-2 border border-light-gray rounded-md"
                    required
                  />
                </div>

                <div class="d-flex flex-column gap-1 flex-1">
                  <label for="time_out" class="text-sm font-semibold text-dark">Time Out:</label>
                  <input type="time" id="time_out" name="time_out" class="p-2 border border-light-gray rounded-md" />
                </div>
              </div>

              <div class="d-flex flex-column gap-1">
                <label for="purpose" class="text-sm font-semibold text-dark">Purpose:</label>
                <textarea
                  id="purpose"
                  name="purpose"
                  rows="3"
                  placeholder="Enter purpose of laboratory usage"
                  class="p-2 border border-light-gray rounded-md"
                  required
                ></textarea>
              </div>
            </fieldset>

            <div class="d-flex flex-row gap-2 mt-2">
              <button type="submit" class="btn btn-primary">Submit Attendance</button>
              <button type="reset" class="btn btn-tertiary">Clear Form</button>
            </div>
          </form>
        </section>
      </main>
    </div>
  </body>

  <script type="module" src="../assets/js/main.js"></script>
  <script type="module" src="../assets/js/pages/attendance.js"></script>
</html>
